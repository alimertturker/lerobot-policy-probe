[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot-policy-probe"
version = "0.1.0"
description = "Find out whether a LeRobot policy is actually trained, and whether it can drive an arm, before you put it on hardware"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "Ali Mert Turker" }]
keywords = ["lerobot", "robotics", "vla", "diagnostics", "smolvla", "pi05", "checkpoint"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# torch, numpy, safetensors and huggingface_hub all arrive through lerobot. `inspect` is the
# only subcommand that works without it, because it reads checkpoints over HTTP rather than
# loading them, so requests-level deps are all it needs.
dependencies = ["lerobot>=0.6.2"]

[project.optional-dependencies]
# `replay` and `score` read a LeRobotDataset.
dataset = ["lerobot[dataset]"]
# `plot` renders PNGs.
plot = ["matplotlib>=3.8"]

[project.scripts]
lerobot-probe = "lerobot_policy_probe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
